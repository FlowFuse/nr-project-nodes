<script type="text/html" data-template-name="project link call">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name">Name</span></label>
        <input type="text" id="node-input-name" class="ff-project-link-input-width">

    </div>

        <label for="node-input-topic"><i class="fa fa-ellipsis-h"></i> <span>Topic</span></label>
        <input type="text" id="node-input-topic" class="ff-project-link-input-width">
    </div>
</script>

<script type="text/javascript">
/* global RED, $ */
(function () {
    const SCOPE_TEAM = 'team'
    const SCOPE_APPLICATION = 'application'
    // Application broadcasts are saved as `broadcast: 'application'` rather than `true` on project link
    // in and out nodes. Older versions of these nodes ignore `scope`, so `true` would make them send or
    // listen for team broadcasts. They treat this value as not a broadcast instead: an out node sends
    // nothing (a broadcast is saved without a target) and an in node only listens for messages sent
    // directly to this instance.
    const BROADCAST_APPLICATION = 'application'

    /**
     * Test a topic string is valid for subscription...
     * * Must not contain the following characters: + # $ \
     * * Must not start with a slash
     * @param {string} subTopic
     * @returns `true` if it is a valid sub topic
     */
    function isValidSubscriptionTopic (subTopic) {
        return /^(?:(?:[^/$+#\b\f\n\r\t\v\0]+)(?:\/(?:[^/$+#\b\f\n\r\t\v\0]+?))*)$/.test(subTopic)
    }

    /**
     * Test a topic string is valid for publishing...
     * * Must not contain the following characters: + # $ \
     * * Must not start with a slash
     * @param {string} subTopic
     * @returns `true` if it is a valid sub topic
     */
    function isValidPublishTopic (subTopic) {
        return /^(?:(?:[^/$+#\b\f\n\r\t\v\0]+)(?:\/(?:[^/$+#\b\f\n\r\t\v\0]+?))*)$/.test(subTopic)
    }

    /** Compare names for sorting, ignoring case (and treating numbers by value) */
    function compareNames (a, b) {
        return (a || '').localeCompare(b || '', undefined, { sensitivity: 'base', numeric: true })
    }

    /**
     * Validate the selected instance
     * @param {string} projectId - the selected instance id (or `all`)
     * @param {object} [opt] - passed by Node-RED when it wants a reason, returned as the validation message
     * @returns {boolean|string} `true` if valid, otherwise `false` (or the reason when `opt` is given)
     */
    function isValidProject (projectId, opt) {
        const invalid = (reason) => opt ? reason : false
        // this is a simple check to see if the selected option has class ff-project-link-bad-option
        const projectList = $('#node-input-projectList')
        if (!projectId) {
            return invalid('No instance selected')
        }
        if (projectId === 'all') {
            return true // broadcast to all is a valid option
        }
        if (!projectList || !projectList.length) {
            return true // assume valid
        }
        // if it is disabled, ignore the check
        if (projectList.prop('disabled')) {
            return true
        }
        if (projectList.find('.ff-project-link-bad-option').is(':selected')) {
            return invalid('Selected instance not found in FlowFuse')
        }
        return true
    }

    function onEditPrepare (node, targetType) {
        const nodeType = targetType || node.type
        let isBroadcast = node.broadcast === true || node.broadcast === 'true' || node.broadcast === BROADCAST_APPLICATION
        let isReturnMode = node.mode === 'return'
        let scope = (node.scope === SCOPE_APPLICATION || node.broadcast === BROADCAST_APPLICATION) ? SCOPE_APPLICATION : SCOPE_TEAM
        let selected = node.project
        /** Target data from the runtime. `null` until loaded */
        let data = null

        const projectList = $('#node-input-projectList')
        const applicationFilter = $('#ff-project-link-application-filter')

        // Initialise UI state according to node state
        $('#node-input-name').val(node.name)
        $('#node-input-topic').val(node.topic)
        $('#node-input-timeout').val(node.timeout)
        $('#node-input-mode').val(node.mode)
        $('#node-input-scope').val(scope)
        $('input:radio[name="ff-project-link-broadcast"]').val([isBroadcast.toString()])

        // watch for switch between broadcast and p2p
        $('input:radio[name="ff-project-link-broadcast"]').on('change', function (e) {
            isBroadcast = e.target.value === 'true'
            renderProjectList()
            updateUI()
        })

        // watch for switch between out and return mode
        if (nodeType === 'project link out') {
            $('#node-input-mode').on('change', function (e) {
                isReturnMode = e.target.value === 'return'
                updateUI()
            })
        }

        // watch for switch between team and application broadcasts
        $('#node-input-scope').on('change', function (e) {
            scope = e.target.value === SCOPE_APPLICATION ? SCOPE_APPLICATION : SCOPE_TEAM
            renderProjectList()
            updateUI()
        })

        // watch for application filter changes
        applicationFilter.on('change', function () {
            renderProjectList()
            updateUI()
        })

        // watch for target project selection change
        projectList.on('change', function (e) {
            selected = e.target.value
            updateUI()
        })

        // if the list fails to load, we still want the original value set in the selector
        // so that if the user clicks Done (or the workspace) the same value is
        // re-entered preventing loss or change of original value
        if (selected) {
            projectList.append(new Option(selected, selected, false, true))
        }
        projectList.prop('disabled', true)
        $.ajax({
            url: 'nr-project-link/projects',
            type: 'GET',
            datatype: 'json'
        })
            .done(function (result) {
                data = result || {}
                loadApplicationFilter()
                renderProjectList()
                updateUI()
            })
            .fail(function (jqXHR, textStatus, errorThrown) {
                console.error(jqXHR, textStatus, errorThrown)
                updateUI()
            })

        updateUI()

        function supportsApplications () {
            return !!data?.supportsApplications
        }

        function isApplicationScope () {
            return supportsApplications() && scope === SCOPE_APPLICATION
        }

        /**
         * Get the applications sorted by name (ignoring case). Applications can share a name,
         * so those are labelled with their id to tell them apart
         * @returns {Array<{id: string, name: string, label: string}>}
         */
        function getApplications () {
            const applications = data.applications || []
            const nameCount = {}
            applications.forEach(application => { nameCount[application.name] = (nameCount[application.name] || 0) + 1 })
            return applications
                .map(application => ({ ...application, label: nameCount[application.name] > 1 ? `${application.name} (${application.id})` : application.name }))
                .sort((a, b) => compareNames(a.label, b.label))
        }

        function loadApplicationFilter () {
            applicationFilter.empty()
            applicationFilter.append(new Option('All applications', '', false, true))
            const selectedItem = (data.instances || []).find(item => item.id === selected)
            for (const application of getApplications()) {
                applicationFilter.append(new Option(application.label, application.id, false, selectedItem?.applicationId === application.id))
            }
        }

        function renderProjectList () {
            if (!data) {
                return
            }
            projectList.empty()
            const instances = data.instances || []

            /** @type {Array<{label: string|null, items: Array}>} */
            let groups
            if (!supportsApplications()) {
                // older platforms do not provide applications - show a flat list
                groups = [{ label: null, items: instances }]
            } else {
                let applications = getApplications()
                if (nodeType === 'project link in' && isBroadcast && isApplicationScope()) {
                    // application broadcasts can only come from this application
                    applications = applications.filter(a => a.id === data.ownApplicationId)
                } else if (applicationFilter.val()) {
                    applications = applications.filter(a => a.id === applicationFilter.val())
                }
                groups = applications.map(application => {
                    return {
                        label: application.label,
                        items: instances.filter(item => item.applicationId === application.id).sort((a, b) => compareNames(a.name, b.name))
                    }
                })
            }

            const matched = (nodeType === 'project link in' && selected === 'all') || instances.some(item => item.id === selected)
            if (selected && !matched) {
                // if the value is not in the list, add it as an option
                projectList.append($('<option>', { class: 'ff-project-link-bad-option', value: selected, text: selected }))
            }

            // broadcast not permitted in link call at this time but has been
            // considered in the code base - possible future iteration
            if (nodeType === 'project link in') {
                let allLabel = 'all instances and remote instances'
                if (supportsApplications()) {
                    allLabel = isApplicationScope() ? 'All instances in this application' : 'All instances in this team'
                }
                projectList.append(new Option(allLabel, 'all', false, selected === 'all'))
            }

            for (const group of groups) {
                let parent = projectList
                if (group.label !== null) {
                    if (!group.items.length) {
                        continue
                    }
                    parent = $('<optgroup>', { label: group.label }).appendTo(projectList)
                }
                for (const item of group.items) {
                    const text = item.type === 'device' ? `${item.name} (remote)` : item.name
                    parent.append(new Option(text, item.id, false, item.id === selected))
                }
            }
            // If nothing in the list is selected (no target yet, or it was filtered out), show a
            // placeholder rather than let the browser silently select the first entry
            const hasSelection = !!selected && projectList.find('option').filter((_i, option) => option.value === selected).length > 0
            if (!hasSelection) {
                const placeholder = projectList.find('option').length ? 'Select an instance' : 'No instances to select'
                projectList.prepend($('<option>', { value: '', text: placeholder, disabled: true, selected: true }))
            }
            // keep track of what is now selected (empty if the previous selection is filtered out)
            selected = projectList.val() || ''
        }

        function updateUI () {
            const showApplications = supportsApplications()
            const filterRow = $('.ff-project-link-filter-row')
            const targetRow = $('.ff-project-link-target-row')
            const scopeRow = $('.ff-project-link-scope-row')
            const tipRow = $('.ff-project-link-tip-row')
            let tip = ''

            if (nodeType === 'project link out' && isReturnMode) {
                $('.ff-project-link-topic-row').hide()
                $('.ff-project-link-list-row').hide()
                filterRow.hide()
                targetRow.hide()
                scopeRow.hide()
                projectList.prop('disabled', true)
            } else if (nodeType === 'project link out') {
                $('.ff-project-link-topic-row').show()
                $('.ff-project-link-list-row').show()
                filterRow.toggle(!isBroadcast && showApplications)
                targetRow.toggle(!isBroadcast)
                scopeRow.toggle(isBroadcast && showApplications)
                projectList.prop('disabled', isBroadcast ? true : (data ? null : true))
                if (isBroadcast && showApplications) {
                    tip = isApplicationScope()
                        ? 'Only instances in this application that listen for <b>application</b> broadcasts will receive the message.'
                        : 'Any instance in this team that listens for <b>team</b> broadcasts can receive the message.'
                }
            } else if (nodeType === 'project link in') {
                const directOptionParent = $('#ff-project-link-radio-input-direct').parent()
                if (data && !showApplications && RED.settings.projectLinkInNode_ownerType === 'application') {
                    // NOTE: On older platforms, remote instances assigned to an application do not support direct
                    // messaging, therefore don't permit "Receive messages sent to this instance"
                    directOptionParent.children('label').text('Receive messages sent to this remote instance')
                    RED.popover.tooltip(directOptionParent.children(), 'Not supported for a remote instance assigned to an application: use broadcast instead')
                    directOptionParent.children().prop('disabled', true)
                    directOptionParent.children().addClass('disabled')
                    if (!isBroadcast) {
                        isBroadcast = true
                        $('input:radio[name="ff-project-link-broadcast"]').val(['true'])
                    }
                }
                $('.ff-project-link-topic-row').show()
                $('.ff-project-link-list-row').show()
                scopeRow.toggle(isBroadcast && showApplications)
                filterRow.toggle(isBroadcast && showApplications && !isApplicationScope())
                targetRow.toggle(isBroadcast)
                projectList.prop('disabled', isBroadcast && data ? null : true)
                if (isBroadcast && showApplications) {
                    tip = isApplicationScope()
                        ? 'Receives messages broadcast to <b>this application</b> by instances in this application.'
                        : 'Receives messages broadcast to <b>the team</b>. Messages broadcast to an application are not received.'
                }
            } else {
                $('.ff-project-link-topic-row').show()
                $('.ff-project-link-list-row').show()
                filterRow.toggle(showApplications)
                targetRow.show()
                projectList.prop('disabled', data ? null : true)
            }

            $('#ff-project-link-scope-tip').html(tip)
            tipRow.toggle(!!tip)

            if (projectList.prop('disabled')) {
                // if the project list is disabled, we cannot select a bad option
                projectList.removeClass('input-error')
            } else if (projectList.length) {
                // if the project list is enabled, we can select a bad option
                const badEntryIsSelected = projectList.find('.ff-project-link-bad-option').is(':selected')
                projectList.toggleClass('input-error', badEntryIsSelected)
            }
        }
    }

    function onEditSave (node) {
        node.project = $('#node-input-projectList').val() || '' // val() is null when nothing can be selected
        node.name = $('#node-input-name').val()
        node.topic = $('#node-input-topic').val()

        if (node.type === 'project link call') {
            node.timeout = $('#node-input-timeout').val()
        }
        if (node.type === 'project link out') {
            node.mode = $('#node-input-mode').val()
        }
        if (node.type === 'project link in' || node.type === 'project link out') {
            node.broadcast = $('input:radio[name="ff-project-link-broadcast"]:checked').val() === 'true'
            node.scope = $('#node-input-scope').val() === SCOPE_APPLICATION ? SCOPE_APPLICATION : SCOPE_TEAM
            if (node.type === 'project link out' && node.broadcast) {
                // the target list is disabled while broadcasting but keeps its selection
                node.project = ''
            }
            if (node.broadcast && node.scope === SCOPE_APPLICATION) {
                node.broadcast = BROADCAST_APPLICATION
            }
        }
    }

    function onAdd () {
        if (this.name === '_DEFAULT_') {
            this.name = ''
            RED.actions.invoke('core:generate-node-names', this, { generateHistory: false })
        }
    }

    RED.nodes.registerType('project link in', {
        category: 'FlowFuse',
        color: '#87D8CF',
        defaults: {
            name: { value: '_DEFAULT_' },
            project: {
                value: '',
                validate: function (v, opt) {
                    if (this.broadcast === 'false' || this.broadcast === false) {
                        return true // don't need to validate project id if we are only receiving messages sent to this instance
                    }
                    if (v === 'all') {
                        return true // if we are listening for broadcast messages from all, we don't need a project id
                    }
                    // otherwise, we need a valid project id
                    return isValidProject(v, opt)
                }
            },
            broadcast: { value: false, required: true },
            scope: { value: SCOPE_TEAM }, // team || application (only used when broadcast is true)
            topic: { value: '', required: true, validate: isValidSubscriptionTopic }
        },
        inputs: 0,
        outputs: 1,
        icon: 'ff-logo.svg',
        paletteLabel: 'project in',
        outputLabels: function (i) {
            return this.name || 'link in'
        },
        // showLabel: false,
        label: function () {
            return this.name || this.topic || 'link in'
        },
        labelStyle: function () {
            return this.name ? 'node_label_italic' : ''
        },
        oneditprepare: function () {
            onEditPrepare(this, 'project link in')
        },
        oneditsave: function () {
            onEditSave(this)
        },
        onadd: onAdd
    })

    RED.nodes.registerType('project link out', {
        category: 'FlowFuse',
        color: '#87D8CF',
        defaults: {
            name: { value: '_DEFAULT_' },
            mode: { value: 'link' }, // link || return
            broadcast: { value: false, required: true },
            scope: { value: SCOPE_TEAM }, // team || application (only used when broadcast is true)
            project: {
                value: '',
                validate: function (v, opt) {
                    if (this.broadcast === 'true' || this.broadcast === true || this.broadcast === BROADCAST_APPLICATION) {
                        return true // don't need to validate project id if we are broadcasting to all
                    }
                    if (this.mode === 'return') {
                        return true
                    }
                    // otherwise, we need a valid project id
                    return isValidProject(v, opt)
                }
            },
            topic: {
                value: '',
                validate: function (v) {
                    if (this.mode === 'return') {
                        return true
                    }
                    return v && isValidPublishTopic(v)
                }
            }
        },
        align: 'right',
        inputs: 1,
        outputs: 0,
        icon: function () {
            if (this.mode === 'return') {
                return 'ff-logo.svg'
            } else {
                return 'ff-logo.svg'
            }
        },
        paletteLabel: 'project out',
        inputLabels: function (i) {
            return this.name || (this.mode === 'return' ? 'link return' : 'link out')
        },
        // showLabel: false,
        label: function () {
            return this.name || (this.mode === 'return' ? 'link return' : this.topic) || 'link out'
        },
        labelStyle: function () {
            return this.name ? 'node_label_italic' : ''
        },
        oneditprepare: function () {
            onEditPrepare(this, 'project link out')
            $('#node-input-mode').on('change', function () {
                $('.node-input-link-rows').toggle(this.value === 'link')
            })
            if (!this.mode) {
                $('#node-input-mode').val('link').trigger('change')
            }
        },
        oneditsave: function () {
            onEditSave(this)
        },
        onadd: onAdd
    })

    RED.nodes.registerType('project link call', {
        category: 'FlowFuse',
        color: '#87D8CF',
        defaults: {
            name: { value: '' },
            project: { value: '', validate: isValidProject }, // isValidProject handles empty, so its reason is shown
            topic: { value: '', required: true, validate: isValidPublishTopic },
            timeout: {
                value: '30',
                label: RED._('node-red:link.timeout'),
                validate: RED.validators.number(true)
            }
        },
        inputs: 1,
        outputs: 1,
        icon: 'ff-logo.svg',
        paletteLabel: 'project call',
        inputLabels: function (i) {
            return this.name || 'link call'
        },
        label: function () {
            return this.name || this.topic || 'link call'
        },
        labelStyle: function () {
            return this.name ? 'node_label_italic' : ''
        },
        oneditprepare: function () {
            onEditPrepare(this, 'project link call')
        },
        oneditsave: function () {
            onEditSave(this)
        }
    })
})()
</script>

<script type="text/html" data-help-name="project link in">
    <p>Receive messages from other Node-RED instances within your FlowFuse Team</p>
    <h3>Details</h3>
    <p>This node can either listen for messages broadcast by other instances and remote instances,
        or listen for messages sent directly to this instance.</p>
    <p>The node is configured with a <code>topic</code> to listen on. This works
       like an MQTT topic - allowing instances to send messages targeting different
       subscribers.</p>
    <p>The node does not support MQTT wildcard characters - a fully qualified topic
       must be used.</p>
    <h3>Broadcast channels</h3>
    <p>When listening for broadcast messages, choose the channel to listen on:</p>
    <ul>
        <li><b>Team broadcasts</b> - messages broadcast to the team by any instance or
            remote instance in the team.</li>
        <li><b>Application broadcasts</b> - messages broadcast to this instance's application by
            instances and remote instances in the same application. Instances outside the application
            cannot send or receive these messages.</li>
    </ul>
    <p>The two channels are separate: a team listener does not receive application broadcasts,
       even from instances in the same application.</p>
    <p>Messages can be received from all sources on the channel or from a specific instance or remote instance.</p>
    <h3>Limitations</h3>
    <p>Older versions of FlowFuse do not support application broadcasts, or remote instances
       assigned to an application receiving messages sent directly to them. On those platforms,
       a specific source can only be another hosted instance in the same team.</p>
    <h3>Output</h3>
    <dl class="message-properties">
        <dt><i>msg</i> <span class="property-type">object</span></dt>
        <dd>
            The message sent by another Node-RED instance to this node.
        </dd>
        <dt><i>projectLink</i> <span class="property-type">object</span></dt>
        <dd>
            This property contains information about the source of the message.
            <ul>
                <li><code>instanceId</code> - the id of the instance that sent the message</li>
                <li><code>projectId</code> - <i>deprecated</i>: the id of the instance that sent the message</li>
                <li><code>deviceId</code> - if present, the id of the remote instance that sent the message</li>
                <li><code>deviceName</code> - if present, the name of the remote instance that sent the message</li>
                <li><code>deviceType</code> - if present, the type of the remote instance that sent the message</li>
                <li><code>applicationId</code> - the id of the application the sender belongs to</li>
                <li><code>topic</code> - the topic the message was received on</li>
                <li><code>scope</code> - for broadcast messages, the channel the message was broadcast on:
                    <code>team</code> or <code>application</code></li>
                <li><code>callStack</code> - when using the Project Call node, this contains
                 information about the call stack. This property must not be modified.</li>
            </ul>
        </dd>
    </dl>
</script>

<script type="text/html" data-help-name="project link out">
    <p>Send messages to other instances within your FlowFuse Team</p>
    <h3>Details</h3>
    <p>This node can be used to send messages to other Node-RED instances.</p>
    <p>
        It provides three modes of operation:
        <ul>
            <li>send messages to another instance or remote instance</li>
            <li>broadcast messages to any instance or remote instance listening on the same topic</li>
            <li>return the message to its sender if it originated from a Project Call node</li>
        </ul>
    </p>
    <p>
        Broadcast messages can be sent on one of two channels:
        <ul>
            <li><b>Team broadcast</b> - received by any instance or remote instance in the team
                listening for team broadcasts.</li>
            <li><b>Application broadcast</b> - only received by instances and remote instances in this
                application listening for application broadcasts.</li>
        </ul>
    </p>
    <p>
        When configured to send or broadcast messages, the node
        is configured with a <code>topic</code> to send on. This works
        like an MQTT topic - allowing instances to send messages targeting different
        subscribers.
    </p>
    <p>
        When configured to return the message to the previous Project Call node,
        the node requires the property <code>msg.projectLink.callStack</code> to
        be present. This property is set by the Project In node when it receives
        messages from a Project Call node. If this property is not present, the
        node will be unable to respond properly.
    </p>
    <h3>Limitations</h3>
    <p>A remote instance assigned to an instance cannot be targeted directly: send the message
       to the instance it is assigned to.</p>
    <p>Older versions of FlowFuse only permit sending to hosted instances, and do not
       support application broadcasts. To reach remote instances on those platforms,
       broadcast on a topic instead.</p>
    <h3>Input</h3>
    <dl class="message-properties">
        <dt><i>msg</i> <span class="property-type">object</span></dt>
        <dd>
            <p>The node will send the complete message object it receives.</p>\
            <p>Due to the way messages are sent, not all types of property will
                be included. For example, the <code>msg.req</code> and <code>msg.res</code> properties
                used by the HTTP nodes will not be sent.
            </p>
        </dd>
    </dl>
</script>

<script type="text/html" data-help-name="project link call">
    <p>Send messages to other Node-RED instances within your FlowFuse Team and get a response back</p>
    <h3>Details</h3>
    <p>
        This node can be used to send messages to other instances and then wait
        for a response to be sent back.
    </p>
    <p>
        The node can be configured with a <code>timeout</code> for how long it
        should wait for a response. If a response does not arrive, it will log
        an error that can be caught with a Catch node
    </p>
    <p>
        The node is configured with a <code>topic</code> to send on. This works
        like an MQTT topic - allowing instances to send messages targeting different
        subscribers.
    </p>
    <h3>Limitations</h3>
    <p>
        The target can be a hosted instance, or a remote instance assigned to an application,
        in the same team. A remote instance assigned to an instance cannot be targeted directly:
        call the instance it is assigned to.
    </p>
    <p>
        Older versions of FlowFuse only permit calls to hosted instances. On those platforms,
        a remote instance can make calls, but cannot receive them.
    </p>
    <p>
        The default timeout is 30 seconds. The target instance must be running and
        have a <code>project link in</code> node listening on the same topic, so
        logic called this way is unavailable whenever the link to the platform is down.
    </p>
    <h3>Output</h3>
    <dl class="message-properties">
        <dt><i>msg</i> <span class="property-type">object</span></dt>
        <dd>
            The message sent by another instance to this node.
        </dd>
        <dt><i>projectLink</i> <span class="property-type">object</span></dt>
        <dd>
            This property contains information about the source of the message.
            <ul>
                <li><code>instanceId</code> - the id of the instance that sent the message</li>
                <li><code>projectId</code> - <i>deprecated</i>: the id of the instance that sent the message</li>
                <li><code>deviceId</code> - if present, the id of the remote instance that sent the message</li>
                <li><code>deviceName</code> - if present, the name of the remote instance that sent the message</li>
                <li><code>deviceType</code> - if present, the type of the remote instance that sent the message</li>
                <li><code>applicationId</code> - the id of the application the sender belongs to</li>
                <li><code>topic</code> - the topic the message was received on</li>
                <li><code>callStack</code> - when using the Project Call node, this contains
                    information about the call stack. This property must not be modified.</li>
               </ul>
        </dd>
    </dl>
</script>
